<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stepper 1.3 - Options</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="container">
        <h1>Stepper 1.3 Options</h1>
        
        <div class="input-section">
            <label for="urlInput">Enter Web App URL:</label>
            <input type="url" id="urlInput" placeholder="https://example.com/app" />
            <button id="saveBtn">Save App</button>
        </div>

        <div class="saved-apps">
            <h2>Saved Apps</h2>
            <div id="appsList"></div>
        </div>

        <div class="actions">
            <button id="clearBtn">Clear All Saved Apps</button>
        </div>
    </div>
    <script src="options.js"></script>
</body>
</html>
